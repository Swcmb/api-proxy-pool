name: Proxy Pool Builder

on:
  workflow_dispatch:
    inputs:
      chunks:
        description: '分片数量'
        required: false
        default: '16'
        type: string
      concurrency:
        description: '并行 Runner 数量'
        required: false
        default: '8'
        type: string
      connections:
        description: 'mubeng 并发连接数'
        required: false
        default: '500'
        type: string
      timeout:
        description: 'mubeng 超时秒数'
        required: false
        default: '10'
        type: string
  schedule:
    - cron: "0 */6 * * *"

env:
  CHUNKS: ${{ github.event.inputs.chunks || '16' }}
  CONCURRENCY: ${{ github.event.inputs.concurrency || '8' }}
  CONNECTIONS: ${{ github.event.inputs.connections || '500' }}
  TIMEOUT: ${{ github.event.inputs.timeout || '10' }}

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download proxy source
        run: |
          mkdir -p workspace

          curl -L \
            https://raw.githubusercontent.com/hproxy-com/free-proxy-list/main/live.csv \
            -o workspace/live.csv

          curl -L \
            https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/all/data.txt \
            -o workspace/proxifly.txt

          VERSION=$(curl -s \
            https://api.github.com/repos/mubeng/mubeng/releases/latest \
            | jq -r .tag_name)

          echo "$VERSION" > workspace/mubeng.version

          wget \
            "https://github.com/mubeng/mubeng/releases/download/${VERSION}/mubeng_linux_amd64.tar.gz" \
            -O workspace/mubeng.tar.gz

          tar xf workspace/mubeng.tar.gz -C workspace
          chmod +x workspace/mubeng

      - uses: actions/upload-artifact@v4
        with:
          name: raw
          path: workspace

  normalize:
    needs: download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: raw
          path: workspace

      - run: |
          python scripts/normalize.py \
            workspace/live.csv \
            workspace/proxifly.txt \
            workspace/all.txt

      - uses: actions/upload-artifact@v4
        with:
          name: normalized
          path: workspace/all.txt

  split:
    needs: normalize
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: normalized
          path: workspace

      - run: |
          python scripts/split.py \
            workspace/all.txt \
            ${{ env.CHUNKS }}

      - name: Build matrix
        id: matrix
        run: |
          MATRIX=$(python -c 'import json, os; print(json.dumps(list(range(int(os.environ["CHUNKS"])))))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: chunks
          path: workspace/chunks

  test:
    needs: split
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(github.event.inputs.concurrency || '8') }}
      matrix:
        id: ${{ fromJSON(needs.split.outputs.matrix) }}
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chunks
          path: workspace/chunks

      - uses: actions/download-artifact@v4
        with:
          name: raw
          path: workspace/raw

      - run: |
          chmod +x workspace/raw/mubeng
          mkdir -p result
          workspace/raw/mubeng \
            -f workspace/chunks/${{ matrix.id }}.txt \
            -o result/alive-${{ matrix.id }}.txt \
            -c ${{ env.CONNECTIONS }} \
            --timeout ${{ env.TIMEOUT }}

      - uses: actions/upload-artifact@v4
        with:
          name: alive-${{ matrix.id }}
          path: result

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: alive-*
          path: alive

      - run: pip install -r requirements.txt

      - run: |
          python scripts/merge_json.py \
            alive \
            public

      - uses: actions/upload-artifact@v4
        with:
          name: proxy-result
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: proxy-result
          path: public

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
