name: Test Free Proxies-2

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests PySocks

      - name: Test proxies
        run: python scripts/test_proxies2.py

      - name: Commit valid proxies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add valid-2.txt fast-2.txt stats-2.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update valid proxies"
            git push
          fi
