name: Refresh Clash Subscription and Publish Gist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-clash-subscription
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout latest repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests PySocks

      - name: Build clash.yaml from fast.txt (with proxy groups)
        run: |
          python - <<'PY'
          import time
          from pathlib import Path

          FAST_FILE = Path("fast.txt")
          OUTPUT_FILE = Path("clash.yaml")
          MAX_NODES = 200

          CLASH_TYPE = {
              "http": "http",
              "https": "http",    # https 代理在 Clash 里是 type: http + tls: true
              "socks5": "socks5",
          }
          EXCLUDED_SCHEMES = {"socks4", "socks4a"}

          if not FAST_FILE.is_file():
              raise SystemExit("fast.txt not found")

          raw_lines = [
              line.strip()
              for line in FAST_FILE.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          print(f"fast.txt entries: {len(raw_lines)}")

          # 解析成 (scheme, host, port)
          parsed = []
          for line in raw_lines:
              scheme, sep, rest = line.partition("://")
              if not sep:
                  scheme, rest = "http", line
              scheme = scheme.lower()
              if scheme in EXCLUDED_SCHEMES or scheme not in CLASH_TYPE:
                  continue
              host, _, port = rest.rpartition(":")
              if not host or not port.isdigit():
                  continue
              port_i = int(port)
              if not 1 <= port_i <= 65535:
                  continue
              parsed.append((scheme, host, port_i))

          # 去重 + 去重命名
          seen = set()
          unique = []
          for scheme, host, port in parsed:
              key = (scheme, host, port)
              if key in seen:
                  continue
              seen.add(key)
              unique.append((scheme, host, port))

          print(f"unique usable nodes: {len(unique)}")

          if not unique:
              raise SystemExit("no usable nodes in fast.txt")

          unique = unique[:MAX_NODES]

          # ---- 生成完整 Clash 配置 ----
          lines = [
              "# Clash config auto-generated by GitHub Actions",
              "# Source: fast.txt",
              "# Generated at: " + time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "",
              "mixed-port: 7890",
              "allow-lan: false",
              "mode: rule",
              "log-level: warning",
              "external-controller: 127.0.0.1:9090",
              "",
              "proxies:",
          ]

          names = []
          seen_names = set()
          for scheme, host, port in unique:
              base = f"{scheme}-{host}-{port}"
              name = base
              i = 1
              while name in seen_names:
                  i += 1
                  name = f"{base}-{i}"
              seen_names.add(name)
              names.append(name)

              lines.append(f'  - name: "{name}"')
              lines.append(f"    type: {CLASH_TYPE[scheme]}")
              if scheme == "https":
                  lines.append("    tls: true")
              lines.append(f"    server: {host}")
              lines.append(f"    port: {port}")

          # 代理组
          lines += [
              "",
              "proxy-groups:",
              '  - name: "手动选择"',
              "    type: select",
              "    proxies:",
              '      - "自动选择"',
              "      - DIRECT",
              '  - name: "自动选择"',
              "    type: url-test",
              "    url: http://www.gstatic.com/generate_204",
              "    interval: 300",
              "    tolerance: 50",
              "    proxies:",
          ]
          for n in names:
              lines.append(f'      - "{n}"')

          # 规则
          lines += [
              "",
              "rules:",
              "  - GEOIP,CN,DIRECT",
              '  - MATCH,手动选择',
              "",
          ]

          OUTPUT_FILE.write_text("\n".join(lines), encoding="utf-8")
          print(f"Wrote {OUTPUT_FILE} with {len(names)} nodes and 2 proxy groups")
          PY

      - name: Validate clash.yaml has proxy groups
        run: |
          grep -q "proxy-groups:" clash.yaml || { echo "missing proxy-groups"; exit 1; }
          grep -q "手动选择" clash.yaml || { echo "missing 手动选择"; exit 1; }
          grep -q "自动选择" clash.yaml || { echo "missing 自动选择"; exit 1; }
          echo "clash.yaml validation OK"
          head -20 clash.yaml

      - name: Commit updated clash.yaml to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash.yaml
          if git diff --cached --quiet; then
            echo "clash.yaml is unchanged"
          else
            git commit -m "chore: refresh Clash subscription"
            git push
          fi

      - name: Publish the same clash.yaml to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import requests

          token = os.environ.get("GIST_TOKEN", "").strip()
          gist_id = os.environ.get("GIST_ID", "").strip()
          if not token:
              raise SystemExit("Missing Actions secret: GIST_TOKEN")
          if not gist_id:
              raise SystemExit("Missing Actions secret: GIST_ID")

          content = Path("clash.yaml").read_text(encoding="utf-8").strip()
          if len(content) < 64 or "proxies:" not in content:
              raise SystemExit("clash.yaml is empty or invalid")
          if "proxy-groups:" not in content:
              raise SystemExit("clash.yaml has no proxy-groups")

          response = requests.patch(
              f"https://api.github.com/gists/{gist_id}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              json={
                  "description": "Auto-generated Clash proxy subscription",
                  "files": {"clash.yaml": {"content": content + "\n"}},
              },
              timeout=30,
          )
          if response.status_code != 200:
              raise SystemExit(
                  f"Gist update failed: HTTP {response.status_code}: {response.text[:500]}"
              )

          data = response.json()
          print(f"Gist updated: {data.get('html_url', '')}")
          print(f"Raw subscription URL: {data['files']['clash.yaml']['raw_url']}")
          PY
