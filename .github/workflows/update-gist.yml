name: Update proxy subscription Gist

on:
  schedule:
    # 每 6 小时跑一次（UTC）
    - cron: '0 */6 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run proxy test and publish to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python scripts/test_proxies.py

      - name: Show summary
        if: always()
        run: |
          echo "=== stats.json ==="
          cat stats.json || true
          echo "=== clash.yaml head ==="
          head -20 clash.yaml || true