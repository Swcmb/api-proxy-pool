name: Publish Clash Subscription to Gist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout latest generated configuration
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Publish existing Clash configuration
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import requests

          token = os.environ.get("GIST_TOKEN", "").strip()
          gist_id = os.environ.get("GIST_ID", "").strip()
          if not token:
              raise SystemExit("Missing Actions secret: GIST_TOKEN")
          if not gist_id:
              raise SystemExit("Missing Actions secret: GIST_ID")

          content = Path("clash.yaml").read_text(encoding="utf-8").strip()
          if len(content) < 64 or "proxies:" not in content:
              raise SystemExit("clash.yaml is empty or does not look like a Clash configuration")

          response = requests.patch(
              f"https://api.github.com/gists/{gist_id}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              json={
                  "description": "Auto-generated Clash proxy subscription",
                  "files": {"clash.yaml": {"content": content + "\n"}},
              },
              timeout=30,
          )
          if response.status_code != 200:
              raise SystemExit(f"Gist update failed: HTTP {response.status_code}: {response.text[:500]}")

          data = response.json()
          print(f"Gist updated: {data.get('html_url', '')}")
          print(f"Raw subscription URL: {data['files']['clash.yaml']['raw_url']}")
          PY
