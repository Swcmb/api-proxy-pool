name: Test Public Proxy Pool

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: test-public-proxy-pool
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests PySocks

      - name: Validate parser tests
        run: |
          python -m py_compile scripts/test_proxies.py
          python -m unittest discover -s tests -v

      - name: Test bounded proxy pool and generate outputs
        run: python scripts/test_proxies.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add valid.txt fast.txt stats.json clash.yaml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update tested proxy pool"
            git push
          fi
