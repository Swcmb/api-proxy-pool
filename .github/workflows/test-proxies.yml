name: Test Free Proxies

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests PySocks

      - name: Exclude SOCKS4 before testing
        run: |
          python - <<'PY'
          import re
          from scripts import test_proxies

          test_proxies.PROXY_PATTERN = re.compile(
              r"^(https?|socks5)://([^:\s]+):(\d+)$",
              re.I,
          )

          print("SOCKS4/SOCKS4A proxies are excluded before testing.")
          test_proxies.main()
          PY

      - name: Commit valid proxies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add valid.txt fast.txt stats.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update valid proxies"
            git push
          fi
